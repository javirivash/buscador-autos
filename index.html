<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Buscador de Autos · GDL / Tepic</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #16181f;
    --text-secondary: #5f6672;
    --text-muted: #9aa1ab;
    --accent: #2563eb;
    --accent-strong: #1d4ed8;
    --accent-soft: #eaf1ff;
    --green: #0f8a5f;
    --green-soft: #e9f8f1;
    --border: #e4e7ec;
    --border-strong: #cbd2da;
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
    --shadow-hover: 0 4px 14px rgba(16,24,40,.10);
    --radius: 14px;
    --radius-sm: 9px;
    --bg-alt: #eef0f3;
    --focus-ring: 0 0 0 3px var(--accent-soft);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 0 16px;
  }
  .container { max-width: 700px; margin: 0 auto; padding: 0 16px; }

  /* ============ NAVBAR (sticky): 3 filas apiladas ============ */
  /* Fila 1: última actualización · Fila 2: tabs · Fila 3: filtros/limpiar/ordenar */
  .navbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface);
    border-style: solid; border-color: var(--border);
    border-width: 0 1px 1px 1px; /* sin borde superior */
    border-radius: 0 0 var(--radius) var(--radius); /* esquinas superiores rectas, inferiores redondeadas */
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    overflow: hidden;
    margin-bottom: 11px; /* igual al gap entre tarjetas */
  }
  /* Fila 1: actualizado, centrado */
  .nav-top {
    display: flex; align-items: center; justify-content: center;
    padding: 6px 16px;
  }
  .nav-update {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-muted); white-space: nowrap;
  }
  .nav-update::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green);
  }
  .nav-update b { font-weight: 600; color: var(--text-secondary); }
  /* Fila 3: Filtros / Limpiar / Ordenar — tres segmentos iguales que llenan la fila */
  .nav-controls {
    display: flex; align-items: stretch; gap: 8px;
    padding: 4px 16px 6px;
  }
  .nav-controls.hidden { display: none; } /* solo se muestra en la vista "Todos" */
  .nf-open { /* Botón primario: borde azul, sin relleno sólido, contenido centrado */
    flex: 1 1 auto;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: transparent; color: var(--accent-strong);
    border: 1.5px solid var(--accent); border-radius: var(--radius-sm);
    padding: 8px 0; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .nf-open:hover { background: var(--accent-soft); border-color: var(--accent-strong); }
  .nf-count { /* inline: con badge, el grupo "Filtros + n" queda centrado */
    font-size: 10px; font-weight: 700; color: #fff; background: var(--accent);
    border-radius: 999px; min-width: 17px; height: 17px; display: inline-flex;
    align-items: center; justify-content: center; padding: 0 4px;
    font-variant-numeric: tabular-nums;
  }
  .nf-count[data-zero="1"] { display: none; } /* sin badge: solo el texto, centrado */
  .nf-clear { /* Botón texto, formato Ordenar: sin fondo ni borde */
    flex: 1 1 auto;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    background: transparent; color: var(--accent-strong);
    border: none; outline: none;
    padding: 8px 0; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: color .15s;
  }
  .nf-clear:hover:not(:disabled) { color: var(--accent); }
  .nf-clear:disabled { color: var(--text-muted); opacity: .55; cursor: default; }
  .nf-wrap { /* Ordenar: sin borde, letra azul, flexible para ocupar la fila */
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none;
  }
  .nf-wrap label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } /* a11y */
  .nf-sort {
    appearance: none; background: transparent; color: var(--accent-strong);
    border: none; outline: none; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: inherit;
    width: 100%; text-align: center; text-overflow: ellipsis; white-space: nowrap;
  }
  .nf-sort:hover { color: var(--accent); }

  /* ============ TABS ============ */
  .tabs {
    display: flex; gap: 6px; background: var(--surface);
    padding: 4px 16px;
  }
  .tab-btn {
    flex: 1; border: none; background: transparent; padding: 9px 0;
    font-size: 14px; font-weight: 600; color: var(--text-secondary);
    border-radius: var(--radius-sm); cursor: pointer; font-family: inherit;
    transition: background .15s, color .15s; text-align: center;
  }
  .tab-btn.active { background: var(--accent); color: #fff; box-shadow: var(--shadow); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* Badge de conteo en las tabs */
  .tab-badge {
    font-size: 10.5px; font-weight: 700; color: #fff; background: var(--accent);
    border-radius: 999px; min-width: 18px; height: 18px; display: inline-flex;
    align-items: center; justify-content: center; padding: 0 5px; margin-left: 5px;
    vertical-align: middle;
  }
  .tab-btn.active .tab-badge { background: rgba(255,255,255,.25); }
  .tab-badge[data-zero="1"] { display: none; }

  /* (la antigua .top10-note quedó sin uso: las notas solo las da el badge de cada tab) */

  /* ============ MODAL DE FILTROS (a pantalla completa, cubre la navbar) ============ */
  .filter-modal {
    position: fixed; inset: 0; z-index: 200; background: var(--surface);
    display: none; flex-direction: column;
  }
  .filter-modal.open { display: flex; }
  .fm-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .fm-body { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
  .fgroup { display: flex; flex-direction: column; gap: 8px; }
  .fgroup {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 11px 12px;
  }
  .fgroup .fg-label { display: block; font-size: 12px; font-weight: 700; color: var(--text-secondary); }

  /* Segmented pills (brand, motor, fuente) */
  .seg { display: flex; flex-wrap: wrap; gap: 7px; }
  .pill {
    appearance: none; background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: 999px;
    padding: 7px 14px; font-size: 13px; font-weight: 500; font-family: inherit;
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent-strong); }
  .pill[data-active="true"] {
    background: var(--accent-soft); color: var(--accent-strong);
    border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent);
    font-weight: 600;
  }

  /* Cascading model / km select */
  .select-native {
    width: 100%; background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 11px 12px; font-size: 14px; font-family: inherit; outline: none;
    box-shadow: var(--shadow); transition: border-color .15s; appearance: none;
  }
  .select-native:focus { border-color: var(--accent); box-shadow: var(--focus-ring); }
  .select-native:disabled { opacity: .6; }

  /* Dual-range slider */
  .dual-range { position: relative; height: 34px; margin: 4px 0 2px; }
  .dual-range input[type=range] {
    -webkit-appearance: none; position: absolute; pointer-events: none;
    width: 100%; height: 0; top: 12px; margin: 0; background: transparent;
  }
  .dual-range input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; pointer-events: all;
    border-radius: 50%; background: var(--accent); border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.18); cursor: pointer; margin-top: -1px;
  }
  .dual-range input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%; background: var(--accent);
    border: 2px solid #fff; cursor: pointer;
  }
  .range-track {
    position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, var(--border-strong) var(--low-pct), var(--accent) var(--low-pct) var(--high-pct), var(--border-strong) var(--high-pct));
  }
  .range-labels {
    display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary);
    padding: 0 2px;
  }
  .range-labels .range-min, .range-labels .range-max { font-variant-numeric: tabular-nums; }

  /* Footer fijo del modal: Cancelar / Aplicar al 50% */
  .fm-footer {
    display: flex; gap: 10px; align-items: center;
    padding: 14px 16px; background: var(--accent-soft); border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .fm-cancel {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    padding: 11px 0; font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; flex: 1;
  }
  .fm-apply {
    background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 11px 0; font-size: 14px; font-weight: 700; font-family: inherit;
    cursor: pointer; flex: 1;
  }

  /* ============ GRID ============ */
  .grid { display: flex; flex-direction: column; gap: 11px; }
  .card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 96px;
    grid-template-rows: auto auto;
    grid-template-areas:
      "head head"
      "body image";
    column-gap: 12px; row-gap: 6px;
    background: var(--surface);
    border-radius: var(--radius); padding: 14px; position: relative;
    border: 1px solid var(--border); box-shadow: var(--shadow);
    text-decoration: none; color: inherit; transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .card:active { box-shadow: var(--shadow-hover); }
  .card-head { grid-area: head; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .card-body { grid-area: body; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .card-title { flex: 1 1 0; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-price { font-size: 19px; font-weight: 700; color: var(--text); line-height: 1.2; }
  .card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 600; line-height: 1.4; }
  .badge-kia { background: #f3e8ff; color: #7c3aed; }
  .badge-hyundai { background: #d1fae5; color: #0f8a5f; }
  .badge-honda { background: #dbeafe; color: #2563eb; }
  .badge-toyota { background: #fee2e2; color: #dc2626; }
  .badge-mazda { background: #fef3c7; color: #b45309; }
  .badge-fuel { background: #fff4e6; color: #b45309; }
  .b-year { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 600; line-height: 1.4; background: #dbeafe; color: #2563eb; }
  .b-km { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 600; line-height: 1.4; background: #e4e4f7; color: #5b21b6; }
  .b-loc { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 600; line-height: 1.4; background: #e0f2fe; color: #0369a1; }
  .trans-badge { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 600; line-height: 1.4; }
  .trans-auto { background: var(--green-soft); color: var(--green); }
  .trans-manual { background: #fef2f2; color: #dc2626; }
  .trans-nv { background: #fef3c7; color: #b45309; }
  .trans-nd { background: #fef9c3; color: #a16207; }
  .fuel-badge { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 600; line-height: 1.4; background: #ccfbf1; color: #0f766e; }
  .fuel-badge-nd { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 600; line-height: 1.4; background: #fef9c3; color: #a16207; }
  .source-badge { font-size: 10px; padding: 2px 7px; border-radius: 5px; background: var(--bg); color: var(--text-muted); font-weight: 500; }
  .card-location { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .card-score {
    flex: 0 0 auto;
    font-size: 10.5px; font-weight: 700; color: var(--accent-strong);
    background: var(--accent-soft); border-radius: 999px; padding: 2px 7px;
    line-height: 1.4; font-variant-numeric: tabular-nums;
  }
  .card-img {
    grid-area: image; justify-self: end; align-self: start;
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: var(--bg);
  }
  .card-img-placeholder { grid-area: image; justify-self: end; align-self: start; width: 100%; aspect-ratio: 1 / 1; display:flex; align-items:center; justify-content:center; background: var(--bg-alt,#eef0f3); color:#9aa1ab; font-size:10px; line-height:1.15; text-align:center; }

  /* ============ GRUPO "mismo auto" ============ */
  .group-card {
    display: block;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--shadow); overflow: hidden;
  }
  .group-card a.card { border: none; box-shadow: none; border-radius: 0; }
  .group-card a.card:hover { transform: none; box-shadow: none; }
  .group-card a.card:active { box-shadow: none; }
  .group-card .card-accord { margin-top: 0; }
  .group-card .accord-toggle {
    border: none; border-top: 1px solid var(--border); border-radius: 0;
  }
  .group-card .accord-list { border: none; border-top: 1px solid var(--border); border-radius: 0; }
  .card-accord { margin-top: 6px; }
  .accord-toggle {
    display: block; width: 100%; text-align: left;
    background: var(--surface); color: var(--accent-strong);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 8px 12px; font-size: 12.5px; font-weight: 600;
    font-family: inherit; cursor: pointer;
  }
  .accord-toggle:hover { background: var(--accent-soft); }
  .accord-list { border: 1px solid var(--border); border-radius: var(--radius-sm); margin-top: 6px; overflow: hidden; }
  .ad-link {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 12px; background: var(--surface); text-decoration: none;
    font-size: 13px; color: var(--text); border-top: 1px solid var(--border);
  }
  .ad-link:first-child { border-top: none; }
  .ad-src {
    font-size: 11px; padding: 2px 7px; border-radius: 5px;
    background: var(--bg); color: var(--text-secondary); font-weight: 500;
  }
  .ad-price { font-weight: 700; color: var(--accent-strong); }
  .ad-go { font-size: 12px; color: var(--text-secondary); }
  .empty {
    text-align: center; padding: 46px 20px; color: var(--text-secondary);
    background: var(--surface); border: 1px dashed var(--border-strong); border-radius: var(--radius);
  }
  .empty-text { font-size: 14px; font-weight: 600; }
  .empty-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

  .footer { margin-top: 24px; text-align: center; font-size: 11px; color: var(--text-muted); padding-bottom: 24px; }

  /* ============ RANK CARD ============ */
  .rank-card {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--shadow); margin-bottom: 11px; overflow: hidden;
  }
  .rank-card a.card { border: none; box-shadow: none; border-radius: 0; padding-bottom: 10px; }
  .rank-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px; background: var(--accent-soft);
  }
  .rank-pos { font-size: 13px; font-weight: 800; color: var(--accent-strong); }
  .rank-score { font-size: 12px; font-weight: 700; color: var(--accent-strong); }
  .score-bars {
    display: flex; gap: 6px; padding: 9px 14px 11px;
    background: var(--surface); border-top: 1px solid var(--border);
  }
  .score-item { flex: 1 1 0; min-width: 0; }
  .score-item .sl {
    font-size: 8.6px; text-transform: uppercase; letter-spacing: .01em;
    color: var(--text-muted); margin-bottom: 3px; line-height: 1.25;
  }
  .score-item .sb { height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .score-item .sf { height: 100%; background: var(--accent); display: block; }
  .score-item .sv { font-size: 10px; color: var(--text-secondary); margin-top: 2px; font-variant-numeric: tabular-nums; }

  @media (max-width: 480px) {
    body { padding: 0 0 10px; }
    .container { padding: 0 12px; }
    .card { padding: 12px; gap: 10px; }
    .card-img { }
    .card-price { font-size: 17px; }
    .card-img-placeholder { display:flex; align-items:center; justify-content:center; background: var(--bg-alt,#eef0f3); color:#9aa1ab; font-size:9px; line-height:1.15; text-align:center; }
    .pill { padding: 6px 12px; font-size: 12.5px; }
    .nav-update { font-size: 10.5px; }
    .nav-controls { gap: 8px; }
  }
</style>
</head>
<body>

  <!-- ============ NAVBAR STICKY (full width de la página) ============ -->
  <nav class="navbar" id="navbar">
    <!-- 1. Última actualización -->
    <div class="nav-top">
      <span class="nav-update">Actualizado: <b id="lastUpdate">Cargando...</b></span>
    </div>

    <!-- 2. Tabs (segmented control) -->
    <div class="tabs">
      <button class="tab-btn active" id="tabBtnTodos" onclick="switchTab('todos')">Todos<span class="tab-badge" id="badgeTodos" data-zero="1">0</span></button>
      <button class="tab-btn" id="tabBtnHoy" onclick="switchTab('hoy')">Hoy<span class="tab-badge" id="badgeHoy" data-zero="1">0</span></button>
      <button class="tab-btn" id="tabBtnTop10" onclick="switchTab('top10')">Top 10</button>
    </div>

    <!-- 3. Filtros + Limpiar (izq) / Ordenar (der) -->
    <div class="nav-controls" id="navControls">
      <button class="nf-open" id="openFiltersBtn" onclick="openFilterModal()">Filtros<span class="nf-count" id="navResultCount" data-zero="1">0</span></button>
      <button class="nf-clear" id="navClearBtn" onclick="resetFilters()" disabled>Limpiar</button>
      <span class="nf-wrap">
        <label for="sortOrder">Ordenar</label>
        <select class="nf-sort" id="sortOrder" onchange="applyFilters()">
          <option value="score_desc" selected>Mayor puntaje</option>
          <option value="score_asc">Menor puntaje</option>
          <option value="price_asc">Menor precio</option>
          <option value="price_desc">Mayor precio</option>
          <option value="year_desc">Más reciente</option>
          <option value="year_asc">Más antiguo</option>
          <option value="km_asc">Menor km</option>
          <option value="km_desc">Mayor km</option>
          <option value="fuel_asc">Menos km/l</option>
          <option value="fuel_desc">Más km/l</option>
        </select>
      </span>
    </div>
  </nav>

  <div class="container">
  <div class="tab-pane" id="pane-hoy">
    <div class="grid" id="gridHoy"></div>
  </div>

  <div class="tab-pane" id="pane-top10">
    <div class="grid" id="gridTop"></div>
  </div>

  <div class="tab-pane active" id="pane-todos">
    <div class="grid" id="grid"></div>
  </div>

  <div class="footer">Actualización diaria 6:00 AM (Tepic)</div>
</div>

<!-- ============ MODAL DE FILTROS (a pantalla completa) ============ -->
<div class="filter-modal" id="filterModal">
  <div class="fm-scroll">
    <div class="fm-body">
      <div class="fgroup">
        <label class="fg-label">Marca</label>
        <div class="seg" id="segBrand"><button class="pill" data-active="true" data-val="" onclick="selectPill('segBrand',this)">Todas</button></div>
      </div>

      <div class="fgroup">
        <label class="fg-label" for="filterModel">Modelo</label>
        <select class="select-native" id="filterModel" onchange="applyFiltersModal()"></select>
      </div>

      <div class="fgroup">
        <label class="fg-label">Motor</label>
        <div class="seg" id="segFuel">
          <button class="pill" data-active="true" data-val="" onclick="selectPill('segFuel',this)">Todos</button>
          <button class="pill" data-active="false" data-val="gasolina" onclick="selectPill('segFuel',this)">Gasolina</button>
          <button class="pill" data-active="false" data-val="hibrido" onclick="selectPill('segFuel',this)">Híbrido</button>
        </div>
      </div>

      <div class="fgroup">
        <label class="fg-label">Fuente</label>
        <div class="seg" id="segSource">
          <button class="pill" data-active="true" data-val="" onclick="selectPill('segSource',this)">Todas</button>
          <button class="pill" data-active="false" data-val="mercadolibre" onclick="selectPill('segSource',this)">Mercado Libre</button>
          <button class="pill" data-active="false" data-val="seminuevos" onclick="selectPill('segSource',this)">SemiNuevos</button>
        </div>
      </div>

      <div class="fgroup">
        <label class="fg-label" for="filterKm">Kilometraje máx.</label>
        <select class="select-native" id="filterKm" onchange="applyFiltersModal()"></select>
      </div>

      <div class="fgroup">
        <label class="fg-label" id="priceLabel">Precio</label>
        <div class="dual-range" id="priceRange">
          <div class="range-track"></div>
          <input type="range" id="priceMin" value="180000" oninput="dualRangeChanged('price', this.value)">
          <input type="range" id="priceMax" value="270000" oninput="dualRangeChanged('price', this.value)">
        </div>
        <div class="range-labels"><span class="range-min" id="priceMinLabel">$180,000</span><span class="range-max" id="priceMaxLabel">$270,000</span></div>
      </div>

      <div class="fgroup">
        <label class="fg-label" id="yearLabel">Año</label>
        <div class="dual-range" id="yearRange">
          <div class="range-track"></div>
          <input type="range" id="yearMin" value="2018" oninput="dualRangeChanged('year', this.value)">
          <input type="range" id="yearMax" value="2026" oninput="dualRangeChanged('year', this.value)">
        </div>
        <div class="range-labels"><span class="range-min" id="yearMinLabel">2018</span><span class="range-max" id="yearMaxLabel">2026</span></div>
      </div>
    </div>
  </div>
  <div class="fm-footer">
    <button class="fm-cancel" onclick="closeFilterModal()">Cancelar</button>
    <button class="fm-apply" onclick="applyFilterModal()">Aplicar</button>
  </div>
</div>

<script>
let allCars = [];
let newCars = [];
let cacheBust = ''; // versión del scrape para cache-buster (fresco tras cada update)
let rangeCache = {}; // avoid redundant re-render when sliders update

const MODEL_KEYWORDS = {
  toyota: ['Camry', 'Corolla', 'Yaris', 'Prius', 'Avalon', 'Rav4', 'C-HR', 'Sienna', 'Tacoma'],
  honda: ['City', 'Civic', 'Accord', 'Fit', 'CR-V', 'HR-V', 'Pilot', 'Odyssey'],
  kia: ['Rio', 'Forte', 'Soul', 'K3', 'Picanto', 'Sportage', 'Sorento', 'Sedona', 'Carnival'],
  hyundai: ['Accent', 'Elantra', 'Grand', 'Ioniq', 'Sonata', 'Veloster', 'Tucson', 'Santa Fe', 'Creta']
};
const HYBRID_KW = ['prius', 'ioniq', 'hev', 'hibrido', 'híbrido', 'phev'];
const BRAND_COLORS = { toyota: 'badge-toyota', honda: 'badge-honda', kia: 'badge-kia', hyundai: 'badge-hyundai', mazda: 'badge-mazda' };

function getModel(c) {
  const brand = (c.brand || '').toLowerCase();
  const t = c.title || '';
  for (const kw of (MODEL_KEYWORDS[brand] || [])) {
    if (t.toLowerCase().includes(kw.toLowerCase())) return kw;
  }
  return null;
}
function getFuel(c) {
  const t = (c.title || '').toLowerCase();
  for (const kw of HYBRID_KW) {
    if (t.includes(kw)) return 'hibrido';
  }
  return 'gasolina';
}
function getKm(c) {
  const raw = (c.mileage || '').replace(/[^\d]/g, '');
  return raw ? parseInt(raw) : null;
}

/* ===== Agrupación "mismo auto físico" ===== */
function groupKey(c) {
  return c.group_id || c.id || [c.brand, c.year, c.mileage, c.price_int].join('|');
}
function uniqueCars(list) {
  const s = new Set();
  for (const c of list) s.add(groupKey(c));
  return s.size;
}
function groupAds(adList) {
  const order = [], idx = new Map();
  for (const a of adList) {
    const k = groupKey(a);
    let g = idx.get(k);
    if (!g) { g = { rep: null, ads: [] }; idx.set(k, g); order.push(g); }
    g.ads.push(a);
  }
  for (const g of order) {
    g.rep = g.ads.reduce((best, a) => {
      const bp = best.price_int || 999999, ap = a.price_int || 999999;
      if (ap !== bp) return ap < bp ? a : best;
      return (parseInt(a.year) || 0) > (parseInt(best.year) || 0) ? a : best;
    });
  }
  return order;
}

async function loadData() {
  try {
    // Cache-buster: fuerza a buscar la versión fresca del scrape (Pages cachea
    // hasta 10 min). Sin esto, tras un scrape el navegador puede mostrar datos viejos.
    const res = await fetch('data/cars.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    cacheBust = (data && data.generated_at) ? data.generated_at : String(Date.now());
    allCars = data.cars || [];
    newCars = data.new_cars || [];
    updateHeader(data);
    populateFilters();
    applyFilters();
    renderHoy();
    loadTop10();
  } catch (e) {
    document.getElementById('lastUpdate').textContent = 'Error cargando datos';
    document.getElementById('grid').innerHTML =
      '<div class="empty"><div class="empty-text">No se pudo cargar la base de datos.</div>' +
      '<div class="empty-sub">Ejecuta el scraper primero (data/cars.json).</div></div>';
    document.getElementById('gridHoy').innerHTML =
      '<div class="empty"><div class="empty-text">No se pudo cargar la base de datos.</div>' +
      '<div class="empty-sub">Ejecuta el scraper primero (data/cars.json).</div></div>';
  }
}

function updateHeader(data) {
  const gen = data.generated_at ? new Date(data.generated_at) : null;
  if (gen) {
    const opts = { timeZone: 'America/Mazatlan', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' };
    document.getElementById('lastUpdate').textContent = gen.toLocaleDateString('es-MX', opts);
  }
  setBadge('badgeHoy', uniqueCars(newCars));
  setBadge('badgeTodos', uniqueCars(allCars));
}

function setBadge(id, n) {
  const el = document.getElementById(id);
  el.textContent = n;
  el.dataset.zero = (n === 0) ? '1' : '0';
}

function renderHoy() {
  const grid = document.getElementById('gridHoy');
  const groups = groupAds(newCars);
  if (!groups.length) {
    grid.innerHTML = '';
    return;
  }
  sortGroups(groups);
  grid.innerHTML = groups.map(renderGroupCard).join('');
}

function sortGroups(groups) {
  const sort = document.getElementById('sortOrder').value || 'score_desc';
  const field = sort.split('_')[0];
  const raw = g => ({
    score: g.rep._score || 0,
    price: g.rep.price_int || 999999,
    year: parseInt(g.rep.year) || 0,
    km: getKm(g.rep) || 9999999,
    fuel: g.rep._fuel != null && g.rep._fuel !== '' ? Number(g.rep._fuel) : null
  })[field] || 0;
  const rev = sort.endsWith('_desc') ? -1 : 1;
  groups.sort((a, b) => {
    const va = raw(a), vb = raw(b);
    // Sin dato de combustible -> siempre al final (independiente de la dirección)
    if (field === 'fuel') {
      const na = va === 0 && (a.rep._fuel == null || a.rep._fuel === '');
      const nb = vb === 0 && (b.rep._fuel == null || b.rep._fuel === '');
      if (na && nb) return 0;
      if (na) return 1;
      if (nb) return -1;
    }
    if (va < vb) return -1 * rev;
    if (va > vb) return 1 * rev;
    return 0;
  });
}

function money(n) { return '$' + n.toLocaleString('es-MX'); }

function populateFilters() {
  const brands = [...new Set(allCars.map(c => c.brand).filter(Boolean))].sort();
  const seg = document.getElementById('segBrand');
  brands.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'pill'; btn.dataset.active = 'false';
    btn.dataset.val = b; btn.textContent = b;
    btn.onclick = () => selectPill('segBrand', btn);
    btn.addEventListener('click', () => selectPill('segBrand', btn));
    seg.appendChild(btn);
  });
  populateModelSelect();
  populateKmSelect();

  // Price range bounds
  const prices = allCars.map(c => c.price_int).filter(p => p > 0);
  if (prices.length) {
    let lo = Math.floor((Math.min(...prices) / 1000)) * 1000;
    let hi = Math.ceil((Math.max(...prices) / 1000)) * 1000;
    if (lo < 50000) lo = 50000;
    if (hi > 300000) hi = 300000;
    setupRange('price', lo, hi, 'price');
  }
  // Year range bounds
  const years = allCars.map(c => parseInt(c.year)).filter(y => !isNaN(y));
  if (years.length) {
    setupRange('year', Math.min(...years), Math.max(...years), 'year');
  }
}

function setupRange(group, lo, hi, type) {
  const minEl = document.getElementById(group + 'Min');
  const maxEl = document.getElementById(group + 'Max');
  minEl.min = lo; minEl.max = hi; maxEl.min = lo; maxEl.max = hi;
  minEl.value = lo; maxEl.value = hi;
  rangeCache[group] = { lo, hi };
  updateRangeUI(group, type);
}

function populateModelSelect() {
  const sel = document.getElementById('filterModel');
  const activeBrand = getActivePill('segBrand');
  const models = new Set();
  allCars.forEach(c => {
    const b = (c.brand || '').toLowerCase();
    if (activeBrand && b !== activeBrand.toLowerCase()) return;
    const m = getModel(c);
    if (m) models.add(m);
  });
  const sorted = [...models].sort((a, b) => a.localeCompare(b, 'es'));
  sel.innerHTML = '';
  const optAll = document.createElement('option');
  optAll.value = ''; optAll.textContent = 'Todos los modelos';
  sel.appendChild(optAll);
  sorted.forEach(m => {
    const o = document.createElement('option'); o.value = m; o.textContent = m; sel.appendChild(o);
  });
}

function populateKmSelect() {
  const sel = document.getElementById('filterKm');
  sel.innerHTML = '';
  const optAll = document.createElement('option');
  optAll.value = ''; optAll.textContent = 'Cualquiera';
  sel.appendChild(optAll);
  [50000, 80000, 100000, 120000, 150000].forEach(km => {
    const o = document.createElement('option');
    o.value = km; o.textContent = 'Hasta ' + km.toLocaleString('es-MX') + ' km'; sel.appendChild(o);
  });
}

function getActivePill(segId) {
  const seg = document.getElementById(segId);
  for (const btn of seg.querySelectorAll('.pill')) {
    if (btn.dataset.active === 'true') return btn.dataset.val;
  }
  return '';
}
function selectPill(segId, clicked) {
  const seg = document.getElementById(segId);
  for (const btn of seg.querySelectorAll('.pill')) btn.dataset.active = (btn === clicked) ? 'true' : 'false';
  if (segId === 'segBrand') populateModelSelect();
  // la hoja de edición no aplica nada en vivo: solo espera a Aplicar
}

function dualRangeChanged(group, val) {
  const minEl = document.getElementById(group + 'Min');
  const maxEl = document.getElementById(group + 'Max');
  val = parseInt(val);
  if (group === 'price') {
    if (val < parseInt(minEl.min)) val = parseInt(minEl.min);
    if (val > parseInt(maxEl.max)) val = parseInt(maxEl.max);
    if (minEl.value > maxEl.value) { maxEl.value = val; }
    if (maxEl.value < minEl.value) { minEl.value = val; }
  } else {
    if (minEl.value > maxEl.value) { maxEl.value = val; }
    if (maxEl.value < minEl.value) { minEl.value = val; }
  }
  updateRangeUI(group, group);
}

function updateRangeUI(group, type) {
  const minEl = document.getElementById(group + 'Min');
  const maxEl = document.getElementById(group + 'Max');
  const lo = parseInt(minEl.value), hi = parseInt(maxEl.value);
  const absLo = parseInt(minEl.min), absHi = parseInt(maxEl.max);
  const span = absHi - absLo || 1;
  const lowPct = ((lo - absLo) / span) * 100;
  const highPct = ((hi - absLo) / span) * 100;
  document.getElementById(group + 'Range').style.setProperty('--low-pct', lowPct + '%');
  document.getElementById(group + 'Range').style.setProperty('--high-pct', highPct + '%');
  const fmt = type === 'year' ? n => String(n) : money;
  document.getElementById(group + 'MinLabel').textContent = fmt(lo);
  document.getElementById(group + 'MaxLabel').textContent = fmt(hi);
  document.getElementById(group + 'Label').textContent =
    (group === 'price' ? 'Precio: ' : 'Año: ') + fmt(lo) + ' – ' + fmt(hi);
}

function currentFilterState() {
  return {
    brand: getActivePill('segBrand'),
    model: document.getElementById('filterModel').value,
    fuel: getActivePill('segFuel'),
    source: getActivePill('segSource'),
    maxKm: parseInt(document.getElementById('filterKm').value || '0'),
    minPrice: parseInt(document.getElementById('priceMin').value),
    maxPrice: parseInt(document.getElementById('priceMax').value),
    minYear: parseInt(document.getElementById('yearMin').value),
    maxYear: parseInt(document.getElementById('yearMax').value)
  };
}

function activeFilterCount(f) {
  let count = 0;
  if (f.brand) count++;
  if (f.model) count++;
  if (f.fuel) count++;
  if (f.source) count++;
  if (f.maxKm) count++;
  if (f.minYear !== parseInt(document.getElementById('yearMin').min) || f.maxYear !== parseInt(document.getElementById('yearMax').max)) count++;
  if (f.minPrice !== parseInt(document.getElementById('priceMin').min) || f.maxPrice !== parseInt(document.getElementById('priceMax').max)) count++;
  return count;
}

function applyFilters() {
  const f = currentFilterState();
  let filtered = allCars.filter(c => {
    if (f.brand && (c.brand || '') !== f.brand) return false;
    if (f.model) { const m = getModel(c); if (!m || m !== f.model) return false; }
    if (f.fuel && getFuel(c) !== f.fuel) return false;
    if (f.source && c.source !== f.source) return false;
    if (f.maxKm) { const km = getKm(c); if (!km || km > f.maxKm) return false; }
    if (f.minPrice && (!c.price_int || c.price_int < f.minPrice)) return false;
    if (f.maxPrice && (!c.price_int || c.price_int > f.maxPrice)) return false;
    if (f.minYear) { const y = parseInt(c.year); if (isNaN(y) || y < f.minYear) return false; }
    if (f.maxYear) { const y = parseInt(c.year); if (isNaN(y) || y > f.maxYear) return false; }
    return true;
  });

  // Contador de filtros activos -> controla visibilidad del badge y del botón Limpiar
  const count = activeFilterCount(f);
  document.getElementById('navClearBtn').disabled = (count === 0);

  const groups = groupAds(filtered);
  // El badge del botón "Filtros(n)" muestra el Nº DE AUTOS RESULTANTES,
  // no el nº de filtros. Solo visible si hay filtros activos (data-zero=1 si no).
  const navC = document.getElementById('navResultCount');
  navC.textContent = groups.length;
  navC.dataset.zero = (count === 0) ? '1' : '0';
  renderGrid(groups);
}

function resetFilters() {
  document.getElementById('segBrand').querySelectorAll('.pill').forEach(b => b.dataset.active = (b.dataset.val === ''));
  document.getElementById('segFuel').querySelectorAll('.pill').forEach(b => b.dataset.active = (b.dataset.val === ''));
  document.getElementById('segSource').querySelectorAll('.pill').forEach(b => b.dataset.active = (b.dataset.val === ''));
  document.getElementById('filterModel').value = '';
  document.getElementById('filterKm').value = '';
  const pmin = document.getElementById('priceMin'), pmax = document.getElementById('priceMax');
  pmin.value = pmin.min; pmax.value = pmax.max; updateRangeUI('price', 'price');
  const ymin = document.getElementById('yearMin'), ymax = document.getElementById('yearMax');
  ymin.value = ymin.min; ymax.value = ymax.max; updateRangeUI('year', 'year');
  populateModelSelect();
  applyFilters();
}

/* ===== Modal de filtros ===== */
// Snapshot del estado de filtros al abrir el modal: Cancelar restaura a este
// estado (que NO es necesariamente el limpio). Aplicar conserva lo editado.
let filterSnapshot = null;

function setPillActive(segId, val) {
  const seg = document.getElementById(segId);
  for (const btn of seg.querySelectorAll('.pill')) btn.dataset.active = (btn.dataset.val === val) ? 'true' : 'false';
}

// Aplica un estado (objeto de currentFilterState) a los inputs del modal.
function applyStateToInputs(f) {
  setPillActive('segBrand', f.brand);
  setPillActive('segFuel', f.fuel);
  setPillActive('segSource', f.source);
  document.getElementById('filterModel').value = f.model;
  document.getElementById('filterKm').value = f.maxKm ? String(f.maxKm) : '';
  document.getElementById('priceMin').value = f.minPrice;
  document.getElementById('priceMax').value = f.maxPrice;
  document.getElementById('yearMin').value = f.minYear;
  document.getElementById('yearMax').value = f.maxYear;
  populateModelSelect(); // refleja la marca restaurada (modelos en cascada)
  updateRangeUI('price', 'price');
  updateRangeUI('year', 'year');
}

function openFilterModal() {
  filterSnapshot = currentFilterState(); // estado previo a editar
  document.getElementById('filterModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeFilterModal() {
  // Cancelar (y la X): devuelve los filtros a su estado anterior, no los limpia.
  if (filterSnapshot) applyStateToInputs(filterSnapshot);
  filterSnapshot = null;
  document.getElementById('filterModal').classList.remove('open');
  document.body.style.overflow = '';
}
function applyFiltersModal() {
  // la hoja de edición: sin acción en vivo
}
function applyFilterModal() {
  document.getElementById('filterModal').classList.remove('open');
  document.body.style.overflow = '';
  filterSnapshot = null;
  applyFilters(); // confirma solo lo editado, sin restaurar nada
}

function switchTab(tab) {
  ['hoy', 'todos', 'top10'].forEach(t => {
    document.getElementById('tabBtn' + (t === 'hoy' ? 'Hoy' : t === 'todos' ? 'Todos' : 'Top10')).classList.toggle('active', t === tab);
  });
  ['pane-hoy', 'pane-todos', 'pane-top10'].forEach(id => {
    document.getElementById(id).classList.toggle('active', id === 'pane-' + tab);
  });
  // La fila de filtros/ordenar solo aplica a la vista "Todos"
  document.getElementById('navControls').classList.toggle('hidden', tab !== 'todos');
}

const RANK_LABELS = { precio: 'Precio', combustible: 'km/l', km: 'Km', anio: 'Año' };

function cardMarkup(c, showScore) {
  const bc = BRAND_COLORS[(c.brand || '').toLowerCase()] || '';
  // Etiqueta de transmisión/estado: usa _trans_status (AT / N/V / ND). ND cubre
  // N/D (no verificado) y modelos fuera de la tabla. Fallback al badge previo.
  const ts = c._trans_status;
  let transHtml;
  if (ts === 'NV') {
    transHtml = '<span class="trans-badge trans-nv">N/V</span>';
  } else if (ts === 'ND') {
    transHtml = '<span class="trans-badge trans-nd">ND</span>';
  } else if (ts === 'AT') {
    transHtml = '<span class="trans-badge trans-auto">Automático</span>';
  } else {
    transHtml = c.transmission === 'automatic'
      ? '<span class="trans-badge trans-auto">Automático</span>'
      : c.transmission === 'manual' ? '<span class="trans-badge trans-manual">MT</span>' : '';
  }
  const srcLabel = c.source === 'mercadolibre' ? 'Mercado Libre' : 'SemiNuevos';
  const fuelBadge = getFuel(c) === 'hibrido' ? '<span class="badge badge-fuel">Híbrido</span>' : '';
  // Badge de rendimiento combinado [xx.x km/l]. Muestra cifra si existe;
  // si no, un badge ND (sin dato) para señalarlo.
  let fuelKmBadge = '';
  if (c._fuel != null && c._fuel !== '') {
    fuelKmBadge = `<span class="fuel-badge">${Number(c._fuel).toFixed(1)} km/l</span>`;
  } else if (c._fuel_status === 'ND') {
    fuelKmBadge = '<span class="fuel-badge-nd">km/l N/D</span>';
  }
  const model = getModel(c);
  const scoreBadge = showScore && c._score != null
    ? `<span class="card-score">${Math.round(c._score)}</span>` : '';

  // Badges normalizados: año, km (xxx,xxx km), ubicación, fuente.
  const bYear = c.year && c.year !== 'N/A'
    ? `<span class="b-year">${c.year}</span>` : '';
  const kmNum = getKm(c);
  const bKm = kmNum ? `<span class="b-km">${kmNum.toLocaleString('es-MX')} km</span>` : '';
  const bLoc = c.location && c.location !== 'N/A'
    ? `<span class="b-loc">${c.location}</span>` : '';
  const bBrand = c.brand
    ? `<span class="badge ${bc}">${c.brand}${model ? ' &middot; ' + model : ''}</span>` : '';

  return `<a href="${c.link || '#'}" target="_blank" rel="noopener" class="card">
      <div class="card-head">
        <div class="card-title">${c.title}</div>
        ${scoreBadge}
      </div>
      <div class="card-body">
        <div class="card-price">${c.price || 'N/A'}</div>
        <div class="card-meta">
          ${bBrand}${bYear}${bKm}
        </div>
        <div class="card-meta">
          ${transHtml}${fuelBadge}${fuelKmBadge}
        </div>
        <div class="card-meta">
          ${bLoc}<span class="source-badge">${srcLabel}</span>
        </div>
      </div>
      ${c.image
        ? `<img class="card-img" src="${c.image}" alt="${c.title}" loading="lazy" onerror="this.outerHTML='<div class=&quot;card-img-placeholder&quot;>Sin<br>imagen</div>'">`
        : `<div class="card-img-placeholder">Sin<br>imagen</div>`}
    </a>`;
}

function renderTop10(data) {
  const grid = document.getElementById('gridTop');
  const cars = (data && data.cars) || [];
  const weights = (data && data.weights) || {};
  if (!cars.length) {
    grid.innerHTML = '';
    return;
  }
  grid.innerHTML = cars.map(c => {
    const comp = c._components || {};
    const bars = Object.keys(RANK_LABELS).map(k => {
      const v = comp[k] != null ? Math.round(comp[k]) : 0;
      const w = weights[k] != null ? Math.round(weights[k] * 100) : null;
      return `<div class="score-item">
        <div class="sl">${RANK_LABELS[k]}${w != null ? ' ' + w + '%' : ''}</div>
        <div class="sb"><span class="sf" style="width:${v}%"></span></div>
        <div class="sv">${v}</div>
      </div>`;
    }).join('');
    return `<div class="rank-card">
      <div class="rank-head">
        <span class="rank-pos">#${c.rank || '?'}</span>
        <span class="rank-score">Puntaje ${c._score != null ? Math.round(c._score) : ''}</span>
      </div>
      ${cardMarkup(c)}
      <div class="score-bars">${bars}</div>
      ${accordionMarkup(c.ads, c)}
    </div>`;
  }).join('');
}

async function loadTop10() {
  try {
    // Mismo cache-buster que loadData: si ya cargamos cars.json usamos su
    // generated_at; si no, un timestamp.
    const res = await fetch('data/top10.json?v=' + (cacheBust || Date.now()));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    renderTop10(await res.json());
  } catch (e) {
    // sin nota: la pestaña Top 10 no muestra descripción
  }
}

function accordionMarkup(ads, rep) {
  if (!ads || ads.length < 2) return '';
  const repKey = rep.link || rep.id;
  const others = ads.filter(a => (a.link || a.id) !== repKey);
  if (!others.length) return '';
  const links = others.map(a => `<a href="${a.link || '#'}" target="_blank" rel="noopener" class="ad-link">
      <span class="ad-src">${a.source === 'mercadolibre' ? 'Mercado Libre' : 'SemiNuevos'}</span>
      <span class="ad-price">${a.price || 'N/A'}</span>
      <span class="ad-go">Abrir</span>
    </a>`).join('');
  return `<div class="card-accord">
      <button type="button" class="accord-toggle" data-count="${others.length}" onclick="toggleAccord(this)">+${others.length} anuncios</button>
      <div class="accord-list" hidden>${links}</div>
    </div>`;
}

function toggleAccord(btn) {
  const list = btn.nextElementSibling;
  const show = list.hidden;
  list.hidden = !show;
  btn.textContent = show ? 'Ocultar anuncios' : ('+' + btn.dataset.count + ' anuncios');
}

function renderGroupCard(g) {
  return `<div class="group-card">
    ${cardMarkup(g.rep, true)}
    ${accordionMarkup(g.ads, g.rep)}
  </div>`;
}

function renderGrid(groups) {
  const grid = document.getElementById('grid');
  if (!groups.length) {
    grid.innerHTML =
      '<div class="empty"><div class="empty-text">No hay autos con estos filtros</div>' +
      '<div class="empty-sub">Prueba ampliar el rango de precio o año, o quitar algún filtro.</div></div>';
    return;
  }
  sortGroups(groups);
  grid.innerHTML = groups.map(renderGroupCard).join('');
}

loadData();
</script>
